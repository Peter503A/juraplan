<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#7c6ff0" />
<title>StudyFlow – Lernplaner Online Marketing & E-Commerce</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237c6ff0'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white'>%E2%9C%A6</text></svg>" />
<style>
/* ===================================================================
   StudyFlow – Lernplaner Online Marketing & E-Commerce
   Design angelehnt an JuraPlan: violettes Theme, Sidebar-Layout
   =================================================================== */

:root {
  --violet-50: #f5f3ff;
  --violet-100: #ede9fe;
  --violet-200: #ddd6fe;
  --violet-300: #c4b5fd;
  --violet-400: #a78bfa;
  --violet-500: #8b5cf6;
  --violet-600: #7c3aed;
  --violet-700: #6d28d9;

  --accent: #7c6ff0;
  --accent-hover: #6a5de0;
  --accent-soft: #ece9fd;

  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --border: #e8e9ee;
  --border-strong: #d7d9e0;

  --text: #1f2430;
  --text-muted: #6b7280;
  --text-faint: #9aa0ac;

  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 3px rgba(20, 20, 40, 0.06), 0 6px 18px rgba(20, 20, 40, 0.05);
  --shadow-lg: 0 10px 40px rgba(20, 20, 40, 0.18);

  --sidebar-w: 248px;

  /* Modul-Farbpalette (wie Screenshots) */
  --c-violet: #7c6ff0;
  --c-amber: #e0ab2a;
  --c-green: #37a874;
  --c-red: #d85757;
  --c-blue: #2f80d6;
  --c-pink: #c457b9;
  --c-orange: #e08a3c;
  --c-teal: #3ca896;

  --ok: #16a34a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

#app { height: 100%; }

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* ---------- Layout ---------- */
.layout {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ---------- Sidebar ---------- */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px 14px;
  overflow-y: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 6px 16px;
}
.brand-logo {
  width: 34px; height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--violet-500), var(--violet-700));
  display: grid; place-items: center;
  color: #fff; font-size: 18px;
  flex-shrink: 0;
}
.brand-text strong { display: block; font-size: 17px; letter-spacing: -0.2px; }
.brand-text strong .accent { color: var(--accent); }
.brand-text span { font-size: 11.5px; color: var(--text-faint); }

.btn-new {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 11px;
  padding: 12px;
  font-size: 14.5px;
  font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 16px;
  transition: background .15s;
  box-shadow: 0 2px 8px rgba(124,111,240,.35);
}
.btn-new:hover { background: var(--accent-hover); }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 11px;
  border-radius: 9px;
  border: none; background: none;
  color: var(--text-muted);
  font-size: 14.5px; font-weight: 500;
  text-align: left; width: 100%;
  transition: all .12s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item .ico { font-size: 16px; width: 20px; text-align: center; }

.nav-section-label {
  font-size: 11px; font-weight: 700; letter-spacing: .6px;
  color: var(--text-faint);
  padding: 18px 11px 6px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-section-label button {
  border: none; background: none; color: var(--text-faint);
  font-size: 17px; line-height: 1; padding: 0 4px; border-radius: 5px;
}
.nav-section-label button:hover { background: var(--surface-2); color: var(--accent); }

.module-pill {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 11px; border-radius: 9px;
  border: none; background: none; width: 100%;
  color: var(--text); font-size: 14px; text-align: left;
  transition: background .12s;
}
.module-pill:hover { background: var(--surface-2); }
.module-pill.active { background: var(--accent-soft); }
.module-pill .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.module-pill .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.module-pill .count { font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

.sidebar-hint {
  font-size: 12px; color: var(--text-faint);
  padding: 10px 11px; line-height: 1.5;
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 4px;
}
.save-status {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: var(--ok); padding: 6px 8px; font-weight: 500;
}
.footer-link {
  display: flex; align-items: center; gap: 8px;
  border: none; background: none; text-align: left;
  color: var(--text-muted); font-size: 13px; padding: 7px 8px; border-radius: 7px;
  width: 100%;
}
.footer-link:hover { background: var(--surface-2); color: var(--text); }

/* ---------- Main ---------- */
.main { overflow-y: auto; padding: 22px 30px 60px; }
.main-eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
  color: var(--text-faint); text-transform: uppercase; margin-bottom: 2px;
}
.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; margin-bottom: 4px;
}
.page-head h1 { font-size: 26px; margin: 0; letter-spacing: -0.4px; }
.page-head .date-badge { font-size: 13px; color: var(--text-muted); white-space: nowrap; padding-top: 6px; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: inline-grid; place-items: center; font-size: 12px; font-weight: 700;
  margin-left: 10px; vertical-align: middle;
}
.page-sub { color: var(--text-muted); font-size: 14px; margin: 2px 0 20px; }

/* ---------- Buttons ---------- */
.btn {
  border: 1px solid var(--border-strong); background: var(--surface);
  color: var(--text); border-radius: 10px; padding: 9px 15px;
  font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px;
  transition: all .12s;
}
.btn:hover { background: var(--surface-2); border-color: var(--text-faint); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 8px rgba(124,111,240,.3); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-sm { padding: 6px 11px; font-size: 13px; }
.btn-icon { padding: 8px 10px; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}
.card-title { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
.card-sub { font-size: 13px; color: var(--text-muted); margin: 0; }

.empty-state {
  text-align: center; padding: 48px 20px;
}
.empty-state .big-ico { font-size: 40px; }
.empty-state h2 { font-size: 20px; margin: 14px 0 6px; }
.empty-state p { color: var(--text-muted); max-width: 440px; margin: 0 auto 18px; }

/* ---------- Grids ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 18px; }
.stat-card { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.stat-card .label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; }
.stat-card .value { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
.stat-card .value small { font-size: 16px; font-weight: 600; color: var(--text-muted); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* ---------- Progress ---------- */
.progress { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

/* ---------- Badges ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
  background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border);
  white-space: nowrap;
}
.badge-pflicht { background: #eef2ff; color: #4f46e5; border-color: #e0e7ff; }
.badge-wp { background: #fef3e2; color: #b45309; border-color: #fde8c8; }
.badge-zusatz { background: #f1f5f9; color: #64748b; border-color: #e2e8f0; }
.badge-dup { background: #fee2e2; color: #dc2626; border-color: #fecaca; }
.badge-group { background: var(--accent-soft); color: var(--accent); border-color: var(--violet-200); }

/* ---------- Forms ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.field label .opt { font-weight: 400; color: var(--text-faint); font-size: 12px; margin-left: 5px; }
.input, .select, .textarea {
  width: 100%; padding: 10px 12px;
  border: 1.5px solid var(--border-strong); border-radius: 10px;
  background: var(--surface); color: var(--text); transition: border-color .12s, box-shadow .12s;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.textarea { resize: vertical; min-height: 72px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field-row-3 { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 8px; align-items: center; }
.unit { font-size: 13px; color: var(--text-muted); }

/* Type toggle (Lernblock / Termin) */
.type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.type-opt {
  border: 1.5px solid var(--border-strong); border-radius: 12px; padding: 14px;
  display: flex; align-items: flex-start; gap: 12px; background: var(--surface); position: relative;
  transition: all .12s;
}
.type-opt:hover { border-color: var(--accent); }
.type-opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.type-opt .ic { font-size: 20px; }
.type-opt .t-title { font-weight: 700; font-size: 14px; }
.type-opt .t-sub { font-size: 12px; color: var(--text-muted); }
.type-opt .check { position: absolute; top: 10px; right: 10px; color: var(--accent); font-size: 15px; display: none; }
.type-opt.sel .check { display: block; }

/* Color swatches */
.color-row { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 34px; height: 34px; border-radius: 9px; border: 2px solid transparent; cursor: pointer;
  position: relative; transition: transform .1s;
}
.swatch:hover { transform: scale(1.08); }
.swatch.sel { border-color: var(--text); box-shadow: 0 0 0 2px #fff inset; }
.swatch-auto {
  width: auto; padding: 0 12px; height: 34px; border-radius: 9px; display: inline-flex; align-items: center; gap: 6px;
  border: 1.5px solid var(--border-strong); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--accent);
}
.swatch-auto.sel { border-color: var(--accent); background: var(--accent-soft); }

/* Priority / segmented */
.segmented { display: flex; gap: 8px; }
.segmented button {
  flex: 1; border: 1.5px solid var(--border-strong); background: var(--surface);
  border-radius: 10px; padding: 9px; font-size: 13.5px; font-weight: 600; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.segmented button.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.checkbox-row { display: flex; align-items: center; gap: 9px; font-size: 14px; }
.checkbox-row input { width: 17px; height: 17px; accent-color: var(--accent); }

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(25,25,40,.45);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  animation: fade .15s;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg);
  width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; animation: pop .18s;
}
.modal.narrow { max-width: 440px; }
.modal.wide { max-width: 760px; }
@keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 6px; }
.modal-head h2 { margin: 0; font-size: 20px; }
.modal-head .close { border: none; background: none; font-size: 22px; color: var(--text-faint); padding: 4px 8px; border-radius: 7px; line-height: 1; }
.modal-head .close:hover { background: var(--surface-2); color: var(--text); }
.modal-body { padding: 14px 22px; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 16px 22px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--surface);
}
.modal-foot .spacer { margin-right: auto; }

/* ---------- Calendar ---------- */
.cal-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.cal-nav { display: flex; align-items: center; gap: 4px; }
.cal-range { font-size: 15px; font-weight: 600; min-width: 170px; }
.view-switch { margin-left: auto; display: flex; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; }
.view-switch button { border: none; background: var(--surface); padding: 8px 14px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); }
.view-switch button.sel { background: var(--accent-soft); color: var(--accent); }
.view-switch button + button { border-left: 1px solid var(--border); }

.cal-layout { display: grid; grid-template-columns: 1fr 268px; gap: 18px; align-items: start; }

/* Week/day grid */
.week-grid-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.week-head { display: grid; border-bottom: 1px solid var(--border); }
.week-head .corner { border-right: 1px solid var(--border); }
.week-head .day-col {
  padding: 10px 6px; text-align: center; border-right: 1px solid var(--border); font-size: 12px; color: var(--text-muted);
}
.week-head .day-col:last-child { border-right: none; }
.week-head .day-col .dnum {
  font-size: 16px; font-weight: 700; color: var(--text); display: inline-grid; place-items: center;
  width: 30px; height: 30px; border-radius: 50%; margin-top: 2px;
}
.week-head .day-col.today .dnum { background: var(--accent); color: #fff; }

.week-scroll { max-height: 62vh; overflow-y: auto; }
.week-body { display: grid; position: relative; }
.time-col { border-right: 1px solid var(--border); }
.time-slot { height: 48px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-faint); text-align: right; padding: 2px 6px 0 0; position: relative; }
.day-column { border-right: 1px solid var(--border); position: relative; }
.day-column:last-child { border-right: none; }
.hour-cell { height: 48px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
.hour-cell:hover { background: var(--accent-soft); }

.event {
  position: absolute; left: 3px; right: 3px; border-radius: 7px; padding: 4px 7px;
  font-size: 11.5px; color: #fff; overflow: hidden; cursor: pointer; z-index: 2;
  box-shadow: 0 1px 3px rgba(0,0,0,.15); border-left: 3px solid rgba(0,0,0,.2);
}
.event .ev-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event .ev-time { opacity: .9; font-size: 10.5px; }
.event.is-termin { border-style: dashed; }
.event-dot-row { display: flex; gap: 3px; margin-top: 2px; }

/* Month grid */
.month-grid { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.month-weekdays { display: grid; grid-template-columns: repeat(7,1fr); border-bottom: 1px solid var(--border); }
.month-weekdays div { padding: 8px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); }
.month-cells { display: grid; grid-template-columns: repeat(7,1fr); }
.month-cell { min-height: 96px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; cursor: pointer; position: relative; }
.month-cell:nth-child(7n) { border-right: none; }
.month-cell:hover { background: var(--surface-2); }
.month-cell.other { background: var(--surface-2); }
.month-cell.other .mnum { color: var(--text-faint); }
.month-cell.today .mnum { background: var(--accent); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: inline-grid; place-items: center; }
.month-cell .mnum { font-size: 13px; font-weight: 600; }
.m-event { font-size: 11px; border-radius: 5px; padding: 1px 5px; color: #fff; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-more { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }

/* Year grid */
.year-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
.mini-month { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); cursor: pointer; }
.mini-month:hover { border-color: var(--accent); }
.mini-month h4 { margin: 0 0 8px; font-size: 14px; text-align: center; }
.mini-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 1px; }
.mini-grid span { aspect-ratio: 1; display: grid; place-items: center; font-size: 10px; border-radius: 4px; color: var(--text-muted); position: relative; }
.mini-grid span.has { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.mini-grid span.today { background: var(--accent); color: #fff; }
.mini-grid span.wd { color: var(--text-faint); font-weight: 600; }

/* Calendar sidebar */
.cal-side { display: flex; flex-direction: column; gap: 14px; }
.cal-side .card { padding: 16px; }
.cal-side .big-h { font-size: 26px; font-weight: 700; }
.mini-stat { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
.mini-stat b { font-variant-numeric: tabular-nums; }

/* ---------- Module list ---------- */
.mod-toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.search-box { flex: 1; min-width: 200px; position: relative; }
.search-box input { width: 100%; padding: 10px 12px 10px 36px; border: 1.5px solid var(--border-strong); border-radius: 10px; }
.search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-box .s-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }

.filter-chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
.chip.sel { background: var(--accent-soft); color: var(--accent); border-color: var(--violet-200); }

.group-header {
  display: flex; align-items: center; justify-content: space-between;
  margin: 22px 0 10px; padding-bottom: 8px; border-bottom: 2px solid var(--border);
}
.group-header h3 { margin: 0; font-size: 16px; }
.group-header .ects-goal { font-size: 13px; }
.ects-goal .ok { color: var(--ok); font-weight: 700; }
.ects-goal .pending { color: var(--text-muted); }

.mod-row {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
  padding: 13px 16px; margin-bottom: 8px; transition: all .12s;
}
.mod-row:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
.mod-row.selected { border-color: var(--accent); background: linear-gradient(0deg, var(--accent-soft), var(--surface) 60%); }
.mod-check { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
.mod-main { flex: 1; min-width: 0; }
.mod-main .m-name { font-weight: 600; font-size: 14.5px; }
.mod-main .m-meta { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mod-main .m-code { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--text-faint); }
.mod-side { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.status-select { border: 1px solid var(--border-strong); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; font-weight: 600; }

/* Module detail */
.mod-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.detail-stat { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
.detail-stat .l { font-size: 12px; color: var(--text-muted); }
.detail-stat .v { font-size: 18px; font-weight: 700; margin-top: 2px; }

.step-list { list-style: none; padding: 0; margin: 0; }
.step-list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.step-list li:last-child { border-bottom: none; }
.step-list input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.step-list .done { text-decoration: line-through; color: var(--text-faint); }
.step-del { margin-left: auto; border: none; background: none; color: var(--text-faint); font-size: 16px; padding: 2px 6px; border-radius: 5px; }
.step-del:hover { background: #fee2e2; color: #dc2626; }

/* ---------- Review ---------- */
.review-period-switch { display: flex; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; }
.review-period-switch button { border: none; background: var(--surface); padding: 8px 16px; font-weight: 600; font-size: 13.5px; color: var(--text-muted); }
.review-period-switch button.sel { background: var(--accent-soft); color: var(--accent); }

.module-time-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.module-time-bar .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.module-time-bar .mtb-name { width: 150px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.module-time-bar .mtb-track { flex: 1; height: 10px; background: var(--border); border-radius: 99px; overflow: hidden; }
.module-time-bar .mtb-track > span { display: block; height: 100%; border-radius: 99px; }
.module-time-bar .mtb-val { font-size: 12.5px; color: var(--text-muted); width: 54px; text-align: right; font-variant-numeric: tabular-nums; }

.open-item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.open-item:last-child { border-bottom: none; }
.open-item .oi-ctx { font-size: 12px; color: var(--text-faint); }
.open-item button { margin-left: auto; }

.entry-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.entry-row:last-child { border-bottom: none; }
.entry-row .e-bar { width: 4px; align-self: stretch; border-radius: 3px; }
.entry-row .e-main { flex: 1; }
.entry-row .e-title { font-weight: 600; font-size: 14px; }
.entry-row .e-meta { font-size: 12.5px; color: var(--text-muted); }
.entry-row .e-time { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* ---------- Settings / Alltag ---------- */
.setting-block { margin-bottom: 8px; }
.day-toggles { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.day-toggle { border: 1.5px solid var(--border-strong); border-radius: 9px; padding: 8px 4px; text-align: center; font-size: 12.5px; font-weight: 600; background: var(--surface); color: var(--text-muted); }
.day-toggle.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.time-inline { display: inline-flex; gap: 6px; align-items: center; }

.suggestion-slot { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface-2); border-radius: 10px; margin-bottom: 8px; border: 1px dashed var(--border-strong); }
.suggestion-slot .ss-day { font-weight: 700; width: 90px; }
.suggestion-slot .ss-time { color: var(--text-muted); font-variant-numeric: tabular-nums; }
.suggestion-slot button { margin-left: auto; }

/* ---------- Misc ---------- */
.empty-mini { text-align: center; color: var(--text-muted); font-size: 13.5px; padding: 18px 10px; }
.link-btn { border: none; background: none; color: var(--accent); font-weight: 600; font-size: 13.5px; padding: 0; cursor: pointer; }
.link-btn:hover { text-decoration: underline; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 11px 20px; border-radius: 10px;
  font-size: 13.5px; font-weight: 500; z-index: 200; box-shadow: var(--shadow-lg);
  animation: toastIn .2s;
}
@keyframes toastIn { from { transform: translate(-50%, 12px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

.mobile-topbar { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 82%; max-width: 300px;
    z-index: 90; transform: translateX(-102%); transition: transform .22s; box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 80; display: none; }
  .scrim.show { display: block; }
  .mobile-topbar {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40;
  }
  .mobile-topbar .menu-btn { border: none; background: none; font-size: 22px; padding: 2px; }
  .mobile-topbar strong { font-size: 16px; }
  .main { padding: 16px; }
  .page-head h1 { font-size: 22px; }
  .stat-grid { grid-template-columns: 1fr; gap: 10px; }
  .grid-2, .mod-detail-grid { grid-template-columns: 1fr; }
  .cal-layout { grid-template-columns: 1fr; }
  .cal-side { order: -1; }
  .year-grid { grid-template-columns: repeat(2,1fr); }
  .field-row { grid-template-columns: 1fr; }
  .type-toggle { grid-template-columns: 1fr; }
  .mod-row { flex-wrap: wrap; }
  .week-head .day-col .dlabel { display: none; }
}
