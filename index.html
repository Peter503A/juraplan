<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7465cf" />
  <meta name="description" content="Dein persönlicher Kalender für Lernblöcke, Termine, Notizen und Fortschritt." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="JuraPlan" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>JuraPlan – Dein Lernkalender</title>
</head>
<body class="antialiased">
  <div id="app" class="app-shell"></div>

  <!-- Dialog-Container -->
  <div id="modal-root"></div>

  <script src="js/db.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/modules.js"></script>
  <script src="js/views/review.js"></script>
  <script src="js/entryDialog.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Service Worker registrieren und automatische Updates sicherstellen.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          // Regelmäßig auf eine neue Version prüfen
          reg.update();
          setInterval(() => reg.update(), 60 * 60 * 1000);

          // Wird ein Update gefunden, sofort aktivieren lassen
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', () => {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                sw.postMessage('SKIP_WAITING');
              }
            });
          });
        }).catch(() => {});

        // Wenn der neue Service Worker übernimmt, Seite einmal neu laden
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
